syntax = "proto3";

option csharp_namespace = "DMC.Grpc";

package dmc;

// DMC Service — V2 gRPC interface for Data Management Capability
// Schema layer: DefineType, GetTypeSchema
// Data layer: SetElement, Search, Print, PrintAll, BatchSet
service DMCService {
  // Schema: Define IdentityKeys for a Type (one-time per Type)
  rpc DefineType (DefineTypeRequest) returns (DefineTypeResponse);

  // Schema: Get IdentityKeys for a Type
  rpc GetTypeSchema (GetTypeSchemaRequest) returns (GetTypeSchemaResponse);

  // Data: Set a Data Element (Server decides Create/Update)
  rpc SetElement (SetElementRequest) returns (SetElementResponse);

  // Data: Search elements by type and/or property filters
  rpc Search (SearchRequest) returns (SearchResponse);

  // Data: Print a single Data Element by key
  rpc Print (PrintRequest) returns (PrintResponse);

  // Data: Print all Data Elements (server streaming)
  rpc PrintAll (PrintAllRequest) returns (stream DataElementMessage);

  // Data: Batch set multiple Data Elements (client streaming)
  rpc BatchSet (stream SetElementRequest) returns (BatchSetResponse);

  // Data: Get element count
  rpc GetCount (Empty) returns (CountResponse);

  // Data: Check if element exists by key
  rpc Contains (ContainsRequest) returns (ContainsResponse);
}

message Empty {}

message KeyValuePair {
  string key = 1;
  string value = 2;
}

// --- Schema messages ---

message DefineTypeRequest {
  string type = 1;
  repeated string identity_keys = 2;
}

message DefineTypeResponse {
  bool success = 1;
  string message = 2;
}

message GetTypeSchemaRequest {
  string type = 1;
}

message GetTypeSchemaResponse {
  bool found = 1;
  string type = 2;
  repeated string identity_keys = 3;
}

// --- SetElement messages ---

message SetElementRequest {
  string type = 1;
  repeated KeyValuePair properties = 2;
  string key = 3;           // Optional: if provided, explicit update by key
  UpdateMode mode = 4;      // MERGE (default) or REPLACE
}

enum UpdateMode {
  MERGE = 0;     // Only update submitted properties, keep the rest
  REPLACE = 1;   // Overwrite entire element with new properties
}

enum SetAction {
  CREATED = 0;
  UPDATED = 1;
  NOT_FOUND = 2;
}

message SetElementResponse {
  bool success = 1;
  string key = 2;
  SetAction action = 3;
  string message = 4;
}

// --- Search messages ---

message SearchRequest {
  string type = 1;                    // Optional: filter by type
  repeated KeyValuePair filters = 2;  // Optional: filter by property subset
}

message SearchResponse {
  repeated DataElementMessage results = 1;
  int32 total_found = 2;
}

// --- Print messages ---

message PrintRequest {
  string key = 1;
}

message PrintResponse {
  bool found = 1;
  string display = 2;
}

message PrintAllRequest {}

message DataElementMessage {
  string key = 1;
  string type = 2;
  repeated KeyValuePair properties = 3;
  string display = 4;
}

// --- Batch messages ---

message BatchSetResponse {
  int32 total_received = 1;
  int32 total_created = 2;
  int32 total_updated = 3;
  repeated string keys = 4;
}

// --- Utility messages ---

message ContainsRequest {
  string key = 1;
}

message ContainsResponse {
  bool exists = 1;
}

message CountResponse {
  int32 count = 1;
}
